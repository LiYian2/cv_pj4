# E5a/E5b: Joint-primary + masked pseudo color refinement under paper RGB-only C_m route
# Key differences vs E2:
#   1. rgb_only_verification: true - C_m from RGB matching only, no depth check
#   2. depth_generation_mode: projected - use render depth (not MASt3R direct)
#   3. Loss weights: mirror real mapping alpha (current config alpha=0.975 -> RGB 97.5%, Depth 2.5%)
#   4. GN: off
#   5. Difix: on
#   6. Placement: midpoint only

Dataset:
  Calibration:
    cx: 256.0
    cy: 256.0
    depth_scale: 200.0
    distorted: false
    fx: 408.09502267671235
    fy: 408.1788442391705
    height: 512
    width: 512
    k1: 0.0
    k2: 0.0
    k3: 0.0
    p1: 0.0
    p2: 0.0
  adaptive_pointsize: true
  begin: 0
  dataset_path: /home/bzhang512/CV_Project/dataset/DL3DV-2/part2_s3po/full
  depth_loss: true
  end: 306
  pcd_downsample: 64
  pcd_downsample_init: 32
  point_size: 0.01
  sensor_type: monocular
  type: dl3dv

Training:
  alpha: 0.975
  edge_threshold: 1.1
  force_keyframe_indices:
  - 0
  - 33
  - 67
  - 101
  - 135
  - 169
  - 203
  - 237
  - 271
  - 305
  gaussian_extent: 1.0
  gaussian_reset: 2001
  gaussian_th: 0.7
  gaussian_update_every: 150
  gaussian_update_offset: 50
  global_BA_itr_num: 500
  init_gaussian_extent: 30
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_update: 100
  init_itr_num: 1050
  kf_cutoff: 0.3
  kf_interval: 1
  kf_min_translation: 0.05
  kf_overlap: 0.9
  kf_translation: 0.08
  lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001
  mapping_itr_nosingle: 10
  mapping_itr_num: 300
  pose_window: 5
  prune_mode: slam
  prune_num: 1
  rgb_boundary_threshold: 0.01
  single_thread: false
  size_threshold: 20
  spherical_harmonics: false
  tracking_itr_num: 300
  window_size: 10

depth:
  error_threshold: 0.1
  final_error_threshold: 0.15
  mean_threshold: 0.3
  min_accurate_pixels_ratio: 0.01
  patch_size: 10
  std_threshold: 0.3

model_params:
  data_device: cuda
  model_path: ''
  resolution: -1
  sh_degree: 0
  source_path: ''
  white_background: false

opt_params:
  densification_interval: 100
  densify_from_iter: 500
  densify_grad_threshold: 0.0002
  densify_until_iter: 15000
  feature_lr: 0.0025
  init_lr: 6
  iterations: 30000
  lambda_dssim: 0.2
  opacity_lr: 0.05
  opacity_reset_interval: 3000
  percent_dense: 0.01
  position_lr_delay_mult: 0.01
  position_lr_final: 0.00016
  position_lr_init: 0.0016
  position_lr_max_steps: 30000
  rotation_lr: 0.001
  scaling_lr: 0.001

pipeline_params:
  compute_cov3D_python: false
  convert_SHs_python: false

Results:
  color_refinement: true
  eval_rendering: true
  export_internal_cache: true
  global_BA: false
  color_refinement_iters: 26000
  save_dir: /data3/bzhang512/part3_online_mapping_experiments/E5b_jointprimary_maskedcolor_rgbonly_cm_difix_realpose
  save_results: true
  save_trj: true
  save_trj_kf_intv: 10
  use_gui: false
  use_wandb: false

  brpo_online_mapping:
    enabled: true
    trigger: keyframe
    topology_mode: joint_primary
    placement_mode: midpoint_only
    max_pseudo_per_gap: 1
    num_pseudo_views_per_step: 1
    num_iterations: 20
    pseudo_map_iters: 20
    enable_pseudo_gradient: true

    # Joint-primary equal-member semantics:
    # - pseudo participates as a single masked member in the same refine window
    # - pseudo does NOT become a Gaussian-maintenance source
    # - pseudo->neighbor heuristic propagation disabled
    pseudo_window_equivalence: true
    extra_real_views: 2
    propagate_pseudo_delta_to_neighbors: false
    update_real_exposure: true
    gaussian_maintenance_source: real_only
    joint_primary_run_legacy_prune: false

    # Loss weights: mirror real mapping loss composition exactly.
    # Runtime resolves from Training.alpha, so pseudo and real stay aligned.
    lambda_real: 1.0
    lambda_pseudo: 1.0
    match_real_loss_weights: true
    lambda_depth: 0.025
    beta_rgb: 0.975

    lambda_pose: 0.01
    lambda_exp: 0.001
    lambda_scale: 0.01
    max_scale: null
    trans_weight: 1.0
    lambda_abs_pose: 0.0
    lambda_abs_t: 3.0
    lambda_abs_r: 0.1
    abs_pose_robust: charbonnier

    # E5b: allow joint-primary pseudo loop to optimize real KF pose
    update_real_pose: true
    update_pseudo_pose: true

    use_depth: true
    split_pseudo_authority: false
    pseudo_scene_mask_mode: both_only
    isotropic_weight: 10.0

    # Matcher
    matcher_mode: dense_pts3d_3d
    matcher_model_name: /home/bzhang512/CV_Project/third_party/S3PO-GS/checkpoints/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth
    matcher_device: cuda
    dense3d_conf_quantile: 0.15
    tau_reproj_px: 20.0
    tau_rel_depth: 1.0

    # Key: projected depth + paper split + RGB-only C_m
    depth_generation_mode: projected
    depth_loss_mode: paper_brpo_split_v1
    depth_consistency_tau: 0.15

    # NEW: RGB-only verification (C_m decoupled from depth)
    rgb_only_verification: true

    # GN: off
    use_gauss_newton: false
    gn_max_iters: 5
    gn_damping: 0.01
    gn_every_n_steps: 1

    seed: 0
    debug_export_root: /data3/bzhang512/part3_online_mapping_experiments/E5b_jointprimary_maskedcolor_rgbonly_cm_difix_realpose/brpo_debug

    # Final color refinement: real + masked pseudo
    color_refinement_use_pseudo: true
    color_refinement_pseudo_ratio: 0.5
    color_refinement_pseudo_weight: 1.0
    color_refinement_pseudo_mask_source: confidence_mask
    color_refinement_log_every: 200

    # Difix: on
    use_difix_restoration: true
    difix_model_name: nvidia/difix_ref
    difix_model_path: null
    difix_timestep: 200
    difix_prompt: 'remove artifacts, restore photorealistic details'
    difix_height: 512
    difix_width: 512
    difix_fusion_mode: brpo_overlap_confidence